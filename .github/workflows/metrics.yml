name: Metrics
on:
  # Schedule updates (jede Stunde)
  schedule: [{cron: "0 * * * *"}]
  # Lässt den Workflow manuell und bei jedem Push auf jeden Branch ausführen
  workflow_dispatch:
  push:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      # Version gepinnt statt @latest, damit ein kaputter Release dich nicht
      # automatisch trifft. Bei Bedarf hier gezielt hochziehen.
      - uses: lowlighter/metrics@v3.34
        with:
          # Your GitHub token
          token: ${{ secrets.GH_TOKEN }}
          # Options
          user: FlyingV111
          template: classic
          base: header, activity, repositories
          config_timezone: Europe/Berlin

          # Language Icons / Topics
          plugin_topics: yes
          plugin_topics_mode: star
          plugin_topics_sort: activity
          plugin_topics_limit: 12

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup,programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup,programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes

          # IsoCalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lines
          # "history" vorerst raus, da dieser Teil am meisten API-Calls
          # braucht und vermutlich der Auslöser für den undefined-Fehler war.
          # Wenn's stabil läuft, kannst du "history" wieder ergänzen:
          # plugin_lines_sections: base,repositories,history
          plugin_lines: yes
          plugin_lines_sections: base,repositories
          plugin_lines_repositories_limit: 4
